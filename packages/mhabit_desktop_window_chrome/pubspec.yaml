name: mhabit_desktop_window_chrome
description: Desktop window chrome, native geometry and package toolbar integration.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  # FIXME(#724): Once a compatible cnativeapi release includes libnativeapi/nativeapi#56,
  # set hooks.user_defines.cnativeapi.skip_platforms to [android] in the root pubspec
  # and verify the release APK omits libcnativeapi.so.
  window_manager: 0.6.0
  macos_window_utils: 1.9.1

dev_dependencies:
  material_ui: ^1.11.1
  flutter_test:
    sdk: flutter
  pigeon: 30.0.4

flutter:
  plugin:
    platforms:
      linux:
        pluginClass: DesktopWindowChromePlugin
      windows:
        pluginClass: DesktopWindowChromePluginCApi
      macos:
        pluginClass: DesktopWindowChromePlugin
