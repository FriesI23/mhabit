# yaml-language-server: $schema=https://raw.githubusercontent.com/flatpak/flatpak-builder/main/data/flatpak-manifest.schema.json

---
app-id: io.github.friesi23.mhabit
runtime: org.freedesktop.Sdk
# Make sure to keep this version in sync with corresponding release CI
# e.g. .github/workflows/app-release.yaml#jobs.build-linux-flatpak
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
command: mhabit
separate-locales: false
finish-args:
  - --share=network
  - --share=ipc
  - --device=dri
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=system-bus
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
modules:
  # <2026-05-19> The Freedesktop runtime version 25.08 provides the libsecret module.
  # Required by: flutter_secure_storage
  # https://github.com/flathub/shared-modules/blob/master/libsecret/libsecret.json
  # - name: libsecret
  #   buildsystem: meson
  #   config-opts:
  #     - -Dmanpage=false
  #     - -Dvapi=false
  #     - -Dgtk_doc=false
  #     - -Dintrospection=false
  #   cleanup:
  #     - /bin
  #     - /include
  #     - /lib/pkgconfig
  #     - /share/man
  #   sources:
  #     - type: archive
  #       url: https://download.gnome.org/sources/libsecret/0.21/libsecret-0.21.6.tar.xz
  #       sha256: 747b8c175be108c880d3adfb9c3537ea66e520e4ad2dccf5dce58003aeeca090

  - name: jsoncpp
    buildsystem: meson
    config-opts:
      - --buildtype=release
      - --default-library=shared
    sources:
      - type: archive
        url: https://github.com/open-source-parsers/jsoncpp/archive/refs/tags/1.9.6.tar.gz
        sha256: f93b6dd7ce796b13d02c108bc9f79812245a82e577581c4c9aabe57075c90ea2

  # Bundle a deterministic CJK font. The app registers this OTF directly with
  # Flutter at startup instead of relying only on Flatpak's fontconfig bridge.
  - name: noto-sans-cjk
    buildsystem: simple
    build-commands:
      - install -Dm644 NotoSansCJKsc-Regular.otf /app/share/fonts/NotoSansCJKsc-Regular.otf
      - install -Dm644 NotoSansCJK.LICENSE.txt /app/share/licenses/${FLATPAK_ID}/NotoSansCJK.LICENSE.txt
      - fc-cache -f /app/share/fonts
      - fc-match -f '%{file}\n' 'Noto Sans CJK SC' | grep -Fx /app/share/fonts/NotoSansCJKsc-Regular.otf
    sources:
      - type: file
        url: https://cdn.jsdelivr.net/gh/notofonts/noto-cjk@Sans2.004/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf
        sha256: 2c76254f6fc379fddfce0a7e84fb5385bb135d3e399294f6eeb6680d0365b74b
      - type: file
        url: https://cdn.jsdelivr.net/gh/notofonts/noto-cjk@Sans2.004/LICENSE
        sha256: 6a73f9541c2de74158c0e7cf6b0a58ef774f5a780bf191f2d7ec9cc53efe2bf2
        dest-filename: NotoSansCJK.LICENSE.txt

  - name: mhabit
    buildsystem: simple
    build-options:
      arch:
        x86_64:
          env:
            BUNDLE_PATH: build/linux/x64/release/bundle
        aarch64:
          env:
            BUNDLE_PATH: build/linux/arm64/release/bundle
    build-commands:
      - install -D $BUNDLE_PATH/mhabit /app/bin/mhabit
      - install -Dm644 assets/logo/macos.svg /app/share/icons/hicolor/scalable/apps/io.github.friesi23.mhabit.svg
      - install -Dm644 configs/flatpak_builder/io.github.friesi23.mhabit.metainfo.xml -t /app/share/metainfo
      - install -Dm644 configs/flatpak_builder/io.github.friesi23.mhabit.desktop -t /app/share/applications
      - cp -r $BUNDLE_PATH/lib /app/bin/lib
      - cp -r $BUNDLE_PATH/data /app/bin/data
    sources:
      - type: dir
        path: ../../
