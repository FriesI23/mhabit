name: Setup Xcode
description: Select an installed stable Xcode 27.0 release.

inputs:
  xcode-version:
    description: Stable Xcode version to select
    required: false
    # TODO: Restore major-version pinning (^27) after adapting and verifying
    # the SDK-gated iPhone Duo behavior introduced in iOS 27.1.
    default: "27.0"

runs:
  using: composite
  steps:
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ inputs.xcode-version }}
    - name: Record selected Xcode
      shell: bash
      run: xcodebuild -version
