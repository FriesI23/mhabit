name: Setup Xcode
description: Select the latest installed stable Xcode 27.x release.

inputs:
  xcode-version:
    description: Stable Xcode version or SemVer range to select
    required: false
    default: "^27"

runs:
  using: composite
  steps:
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ inputs.xcode-version }}
    - name: Record selected Xcode
      shell: bash
      run: xcodebuild -version
