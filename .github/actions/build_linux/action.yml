name: Build Linux
description: >
  General Linux build process.
  Build outputs are located in `build/linux/<arch>/f_generic/release/bundle`.
  Requires Flutter and Linux development dependencies installed on the runner.

inputs:
  arch:
    description: Target architecture of the Bundle. Can be "x64" or "arm64".
    required: false
    default: x64

outputs:
  path:
    description: "Path to generated Bundle Dir"
    value: ${{ steps.build-bundle.outputs.path }}

runs:
  using: composite
  steps:
    - name: Install dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y \
          lld-14 libsqlite3-0 libsqlite3-dev \
          libsecret-1-dev libjsoncpp-dev
      shell: bash
    - name: Build Linux Bundle
      id: build-bundle
      env:
        TARGET_ARCH: ${{ inputs.arch }}
        BUILD_FLAVOR: f_generic
      run: |
        flutter build linux --release --flavor "$BUILD_FLAVOR"
        OUTPUT_PATH="build/linux/$TARGET_ARCH/$BUILD_FLAVOR/release/bundle"
        ls -al "$OUTPUT_PATH"
        echo "path=$OUTPUT_PATH" >> "$GITHUB_OUTPUT"
      shell: bash
