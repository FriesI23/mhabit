# see: https://github.com/dorny/test-reporter#recommended-setup-for-public-repositories
name: Test CI Report

on:
  workflow_run:
    workflows:
      - Test CI
    types:
      - completed

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: dorny/test-reporter@v3
        with:
          artifact: flutter-unittest-result
          name: Flutter Test
          path: test_report.log
          reporter: flutter-json
      - uses: dorny/test-reporter@v3
        with:
          artifact: flutter-package-unittest-result
          name: Flutter Package Test
          path: build/test-results/flutter/*.json
          reporter: flutter-json
      - uses: dorny/test-reporter@v3
        with:
          artifact: dart-package-unittest-result
          name: Dart Package Test
          path: build/test-results/dart/*.json
          reporter: dart-json
