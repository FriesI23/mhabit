events {}
http {
  map $upstream_status $mixed_challenge {
    default "";
    401 'Basic realm="WebDAV", Bearer resource_metadata="https://localhost/.well-known/oauth-protected-resource/"';
  }
  log_format regression '$request_method $uri $status upstream=$upstream_status';
  access_log /var/log/nginx/access.log regression;
  ssl_certificate /etc/nginx/tls/cert.pem;
  ssl_certificate_key /etc/nginx/tls/key.pem;
  server {
    listen 443 ssl;
    location / {
      proxy_pass http://basic;
      proxy_set_header Host $host;
      proxy_redirect off;
    }
  }
  server {
    listen 444 ssl;
    location / {
      proxy_pass http://basic;
      proxy_set_header Host $host;
      proxy_redirect off;
      proxy_hide_header WWW-Authenticate;
      add_header WWW-Authenticate $mixed_challenge always;
    }
  }
  server {
    listen 445 ssl;
    location / {
      proxy_pass http://digest;
      proxy_set_header Host $host;
      proxy_redirect off;
    }
  }
}
